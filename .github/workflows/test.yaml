name: Tests

on: [push]

jobs:
  build:
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64
          - runner: windows-2025
            suffix: windows-amd64.exe
          - runner: macos-15-intel
            suffix: macos-amd64
          - runner: macos-26
            suffix: macos-arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Build
        env:
          CGO_ENABLED: ${{ runner.os == 'Windows' && '' || '1' }}
        run: go build -v -o ./bin/dbdiff-${{ matrix.platform.suffix }} ./cmd/dbdiff

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Check The Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reports these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64
    runs-on: ${{ matrix.platform.runner }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dbdiff
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Cache The Temporary PostgreSQL Server
        uses: actions/cache@v4
        with:
          path: |
            ~/.go-embedded-postgres
            ~/.cache/dbdiff
          key: embedded-postgres-${{ matrix.platform.suffix }}

      - name: Run Tests
        env:
          CGO_ENABLED: 1
        run: go test -v -coverprofile=coverage.out ./...

      - name: Show The Coverage
        run: go tool cover -func=coverage.out

  # A runner of macOS and a runner of Windows start no service container, so these two
  # platforms run every test that needs no PostgreSQL server. The -short flag stops the
  # tests of the temporary server, and DBDIFF_TEST_SKIP_POSTGRES stops the tests of the
  # postgres driver. The job of Linux above covers both groups.
  test-without-a-server:
    strategy:
      matrix:
        platform:
          - runner: windows-2025
            suffix: windows-amd64.exe
          - runner: macos-15-intel
            suffix: macos-amd64
          - runner: macos-26
            suffix: macos-arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Run Tests
        env:
          CGO_ENABLED: ${{ runner.os == 'Windows' && '' || '1' }}
          DBDIFF_TEST_SKIP_POSTGRES: 1
        run: go test -v -short ./...


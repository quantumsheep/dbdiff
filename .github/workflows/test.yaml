name: Tests

# A push of a tag runs the tests through the call of the release workflow, so the push
# trigger covers the branches only.
on:
  push:
    branches: ["**"]
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64
          - runner: windows-2025
            suffix: windows-amd64.exe
          - runner: macos-15-intel
            suffix: macos-amd64
          - runner: macos-26
            suffix: macos-arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v -o ./bin/dbdiff-${{ matrix.platform.suffix }} ./cmd/dbdiff

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  test:
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64
    runs-on: ${{ matrix.platform.runner }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dbdiff
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dbdiff
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: dbdiff
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install The Dependencies Of The Temporary MySQL Server
        run: |
          sudo apt-get update
          sudo apt-get install -y libaio1t64 libncurses6
          sudo ln -sf /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libaio.so.1t64 /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libaio.so.1

      - name: Cache The Temporary PostgreSQL Server
        uses: actions/cache@v4
        with:
          path: |
            ~/.go-embedded-postgres
            ~/.cache/dbdiff
          key: embedded-postgres-${{ matrix.platform.suffix }}

      - name: Run Tests
        run: go test -v -coverpkg=./... -coverprofile=coverage.out ./...

      # The race detector slows the decompression of the temporary servers past the time
      # limit of a test, so the -short flag stops the tests of the temporary servers here.
      - name: Run Tests With The Race Detector
        run: go test -race -short ./...

      - name: Show The Coverage
        run: go tool cover -func=coverage.out

  # A runner of macOS and a runner of Windows start no service container, so these two
  # platforms run every test that needs no database server. The -short flag stops the
  # tests of the temporary server, DBDIFF_TEST_SKIP_POSTGRES stops the tests of the
  # postgres driver, and DBDIFF_TEST_SKIP_MYSQL stops the tests of the mysql driver. The
  # job of Linux above covers every group.
  test-without-a-server:
    strategy:
      matrix:
        platform:
          - runner: windows-2025
            suffix: windows-amd64.exe
          - runner: macos-15-intel
            suffix: macos-amd64
          - runner: macos-26
            suffix: macos-arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Tests
        env:
          DBDIFF_TEST_SKIP_POSTGRES: 1
          DBDIFF_TEST_SKIP_MYSQL: 1
        run: go test -v -short ./...

